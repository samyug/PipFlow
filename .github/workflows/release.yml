name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pipflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build app with bundled model
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          command -v cmake
          ./build.sh
          ./scripts/smoke-test.sh
          ./scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PipFlow-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Create draft GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: PipFlow-*
          path: release-assets
          merge-multiple: true
      - name: Verify downloads and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum -c ./*.sha256
          gh release create "$TAG" ./*.zip ./*.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "PipFlow $TAG" \
            --notes "Choose the Apple Silicon (arm64) or Intel (x86_64) ZIP for macOS 13.4 or later. Both downloads include the offline speech model. These preview builds are ad-hoc signed and have not been notarized."
